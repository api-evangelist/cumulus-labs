aid: cumulus-labs
name: Cumulus Labs
description: >-
  Cumulus Labs is a Y Combinator (W26) company building a unified inference
  platform for production AI. Cumulus consolidates the eight subsystems teams
  normally assemble from separate vendors — an OpenAI-compatible gateway, a
  per-workflow router, a layered prompt/KV cache, request-level observability,
  continuous shadow evaluation, one-click LoRA fine-tuning, custom open-weight
  hosting, and the proprietary Ion inference engine running on NVIDIA Grace and
  Blackwell GPUs — behind a single OpenAI-compatible API at
  api.cumuluslabs.io/v1. Ion's custom attention kernels deliver 30-50% more
  throughput than stock vLLM and SGLang, and the gateway is a drop-in
  replacement for the OpenAI, Anthropic, LangChain, LlamaIndex, and Vercel AI
  SDKs — change one line of configuration and keep your existing code.
